<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>검 강화하기</title>

    <!-- ⚠️ 링크에 보낸이(f)·한마디(m)가 실린다. 검색에 남으면 곤란하다(거북이와 같은 규칙). -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- 말풍선 미리보기. **한 종으로 통일한다**(2026-10-07 사용자: "그림만 보여주면될듯 / 내용도 그냥 통일").
         정적 호스팅이라 쿼리로는 이게 안 바뀐다 — 단계별로 다르게 하려면 단계마다 HTML을 따로
         찍어야 하는데, 자세한 건 들어와서 보면 된다는 판단이다. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="검 강화하기" />
    <meta property="og:description" content="누가 강화 자랑을 보냈어요. 눌러서 확인해 보세요." />
    <meta property="og:url" content="https://hate-avocado.github.io/swordenhance-web/" />
    <meta property="og:image" content="https://hate-avocado.github.io/swordenhance-web/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 앱과 **같은 글꼴**(나눔고딕 Bold · 제목은 Black Han Sans). 앱은 서브셋을 굽지만 여기는
         유저가 아무 글자나 적을 수 있어 **전체 글꼴**을 받는다 — 그래서 두부(□)가 구조적으로 없다. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700;800&display=swap"
    />
    <style>
      /* 게임 화면과 같은 색·글꼴이다. 요즘 앱처럼 다듬지 않는다 — 들어왔을 때 같은 물건으로 보여야 한다. */
      :root {
        --paper: #fff;
        --ink: #000;
        --grey: #767676;
        --red: #e0261c;
        --go: "Nanum Gothic", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        --hv: "Black Han Sans", var(--go);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--paper); color: var(--ink); }
      body {
        font-family: var(--go);
        padding: env(safe-area-inset-top, 0px) 0 calc(env(safe-area-inset-bottom, 0px) + 96px);
        -webkit-text-size-adjust: 100%;
      }
      .wrap { max-width: 420px; margin: 0 auto; padding: 0 18px; text-align: center; }

      /* 제목 — 앱의 빨간 제목 그대로(흰 테두리 두른 Black Han Sans). */
      .apptitle {
        margin: 18px 0 0; font: 400 34px/1.1 var(--hv); color: var(--red);
        -webkit-text-stroke: 1px #000; paint-order: stroke fill;
      }
      .from { margin: 18px 0 0; font: 700 15px/1.4 var(--go); color: var(--grey); }
      .from b { color: var(--ink); }
      .big { margin: 6px 0 0; font: 800 26px/1.3 var(--go); }
      .big .lv { color: var(--red); }
      .sub { margin: 6px 0 0; font: 700 14px/1.4 var(--go); color: var(--grey); }

      /* 검 그림. **45°로 눕는다** — 앱의 `.art`가 `rotate(45deg)`라 똑바로 세우면 다른 게임처럼 보인다.
         돌린 만큼 대각선이 길어지므로 바깥 상자를 정사각으로 넉넉히 준다(세로 320 · 검 230). */
      /* ⚠️ `overflow: hidden`이 **꼭 있어야 한다.** 45°로 돈 조각들의 바깥 상자가 가로로 삐져나가
         390 화면에서 434px가 됐다(2026-10-07 실측 — 가로 스크롤이 생긴다). 그림 자체는 이 상자 안에
         다 들어오므로 잘리는 건 없다. */
      .artwrap { height: 360px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-top: 6px; }
      .art { position: relative; height: 262px; display: flex; align-items: center; justify-content: center; transform: rotate(45deg); }
      .art img { max-height: 262px; max-width: none; width: auto; }
      /* 유료 스킨(도끼)은 같은 캔버스 안에서 검보다 크게 그려져 있다 — 앱과 같은 88%로 줄인다. */
      .art img.skin { max-height: 230px; }
      /* 파괴면 **두 동강 내고 어둡게** 한다(2026-10-07 사용자 선택). PNG를 따로 만들지 않는다 —
         **같은 파일을 두 번 띄워** 위·아래 반쪽만 보이게 자르고 서로 어긋나게 민다.
         효과라서 도끼든 앞으로 나올 무기든 그대로 걸린다(사용자: "다른무기에도 써먹게").
         ⚠️ 광채(`drop-shadow`)는 **끈다**. 부서진 검이 빛나면 안 된다.
         ⚠️ 갉기(`feTurbulence`)는 **같이 걸지 않는다** — 두 번 망가뜨리면 형체가 사라져 무슨 무기였는지
            안 보인다(2026-10-07에 나란히 찍어 고른 결과). 단면이 매끈한 것은 사용자가 보고 괜찮다고 한 것. */
      .art.broken img { filter: grayscale(1) brightness(0.38) contrast(1.35) !important; }
      /* 윗조각은 흐름에 남아 **상자 크기를 정하고**, 아랫조각만 그 위에 절대 위치로 겹친다 —
         둘 다 띄우면 `.art`의 폭이 0이 돼 가운데 정렬이 무너진다. */
      .art.broken .top { clip-path: inset(0 0 50% 0); transform: translate(10px, -14px) rotate(-13deg); }
      .art.broken .bot {
        position: absolute; left: 50%; top: 50%;
        clip-path: inset(50% 0 0 0);
        transform: translate(-50%, -50%) translate(-10px, 14px) rotate(6deg);
      }

      /* 마지막 단계(+29) 임팩트 — 앱의 `.sword-aura` 그대로다(색·별 좌표는 `SwordArt.tsx`가 준다). */
      .swordfx { position: absolute; top: 50%; left: 50%; height: 100%; aspect-ratio: 1 / 1; transform: translate(-50%, -50%); pointer-events: none; }
      .sword-aura .aura { transform-box: fill-box; transform-origin: center; animation: auraPulse 2.6s steps(8) infinite; }
      .sword-aura .aura2 { animation-duration: 1.9s; animation-direction: alternate-reverse; }
      .sword-aura .aurastars { transform-box: fill-box; transform-origin: center; animation: starSpin 4s steps(8) infinite; }
      @keyframes auraPulse {
        0%, 100% { opacity: 0.45; transform: scale(0.92); }
        50% { opacity: 0.9; transform: scale(1.1); }
      }
      /* 여덟 칸으로 뚝뚝 끊어 돈다 — 부드럽게 돌면 이 게임 것이 아니다. */
      @keyframes starSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .sword-aura .aura, .sword-aura .aurastars { animation: none !important; } }

      /* 네모 상자 둘 — 게임의 모달과 같은 검은 3px 테두리다. 둥글리지 않는다. */
      .box { border: 3px solid var(--ink); padding: 12px 14px; margin-top: 14px; text-align: center; }
      .box .label { font: 700 13px/1.3 var(--go); color: var(--grey); }
      /* ⚠️ 유저가 적은 글자다. **`textContent`로만 넣는다**(아래 스크립트) — 넣는 길이 하나뿐이라
         남의 글이 태그로 해석될 자리가 없다. */
      .word { margin: 4px 0 0; font: 700 17px/1.45 var(--go); word-break: break-word; }
      .stats { display: flex; justify-content: center; gap: 18px; font: 700 15px/1.4 var(--go); }
      .stats .k { color: var(--grey); font-weight: 700; }

      /* 아래 고정 버튼. 게임의 검은 네모 버튼이다. */
      .bar {
        position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper);
        border-top: 1px solid #ddd; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
      }
      .bar .inner { max-width: 420px; margin: 0 auto; display: flex; gap: 8px; }
      .btn {
        flex: 1; display: block; height: 52px; line-height: 46px; text-align: center;
        font: 800 17px/46px var(--go); text-decoration: none; cursor: pointer;
        border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
      }
      .btn.p { background: var(--ink); color: var(--paper); }
      .note { margin: 8px 0 0; font: 700 12px/1.4 var(--go); color: var(--grey); text-align: center; }

      /* 링크가 깨졌을 때(거북이와 같은 자리). 막다른 화면을 만들지 않는다 — 버튼은 남는다. */
      .empty { padding: 60px 0; }
      .empty .et { font: 800 20px/1.4 var(--go); }
      .empty .eb { margin-top: 8px; font: 700 15px/1.5 var(--go); color: var(--grey); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 class="apptitle">검 강화하기</h1>
      <div id="main" hidden>
        <p class="from"><b id="who"></b>님이 보냈어요</p>
        <p class="big" id="headline"></p>
        <p class="sub" id="sub"></p>
        <div class="artwrap"><div class="art" id="art"><img id="pic" alt="" /></div></div>
        <div class="box" id="wordbox" hidden>
          <div class="label"><span id="who2"></span>님의 한마디</div>
          <p class="word" id="word"></p>
        </div>
        <div class="box">
          <div class="stats">
            <span><span class="k">성공률</span> <span id="rate"></span></span>
            <span><span class="k">판매가</span> <span id="sell"></span></span>
          </div>
        </div>
      </div>
      <div id="empty" class="empty" hidden>
        <p class="et" id="et">받은 자랑이 없어요</p>
        <p class="eb" id="eb">친구가 보낸 링크로 들어오면<br />무슨 검인지 볼 수 있어요.</p>
      </div>
    </div>

    <div class="bar">
      <div class="inner">
        <a class="btn p" id="open" href="intoss://swordenhance">검 강화하기</a>
      </div>
      <p class="note">토스 앱에서 열려요</p>
    </div>

    <script>
      /* 단계표는 `app/src/sword/config.ts`에서 빌드가 박아 넣는다 — 여기서 숫자를 손으로 적지 않는다. */
      const DATA = {"levels":[{"name":"녹슨 단검","o":"을","i":"이","p":1,"sell":0,"glow":"#9AA0A6"},{"name":"그냥 단검","o":"을","i":"이","p":1,"sell":200,"glow":"#9AA0A6"},{"name":"왠지 강한 검","o":"을","i":"이","p":1,"sell":450,"glow":"#9AA0A6"},{"name":"강철 검","o":"을","i":"이","p":0.95,"sell":750,"glow":"#9AA0A6"},{"name":"은장 소검","o":"을","i":"이","p":0.95,"sell":1100,"glow":"#BFD9F2"},{"name":"바람의 검","o":"을","i":"이","p":0.9,"sell":1800,"glow":"#7FE6B4"},{"name":"얼음 롱소드","o":"를","i":"가","p":0.9,"sell":3800,"glow":"#9FDCFF"},{"name":"파이어 블레이드","o":"를","i":"가","p":0.9,"sell":6500,"glow":"#FF7A1A"},{"name":"은빛 마검","o":"을","i":"이","p":0.85,"sell":11000,"glow":"#B266FF"},{"name":"다크 소드","o":"를","i":"가","p":0.8,"sell":22000,"glow":"#8A3FFF"},{"name":"홀리 소드","o":"를","i":"가","p":0.8,"sell":38000,"glow":"#FFD54A"},{"name":"드래곤 슬레이어","o":"를","i":"가","p":0.75,"sell":150000,"glow":"#4CB05A"},{"name":"크리스탈 검","o":"을","i":"이","p":0.7,"sell":365000,"glow":"#FF8AE0"},{"name":"짝퉁 엑스칼리버","o":"를","i":"가","p":0.7,"sell":950000,"glow":"#FFE600"},{"name":"뇌전검","o":"을","i":"이","p":0.65,"sell":3200000,"glow":"#FFE14D"},{"name":"듀란달","o":"을","i":"이","p":0.6,"sell":7000000,"glow":"#F2D07A"},{"name":"발뭉","o":"을","i":"이","p":0.6,"sell":13500000,"glow":"#4A78E6"},{"name":"아론다이트","o":"를","i":"가","p":0.55,"sell":21000000,"glow":"#3F62FF"},{"name":"레바테인","o":"을","i":"이","p":0.5,"sell":28000000,"glow":"#FF3B1F"},{"name":"진짜 엑스칼리버","o":"를","i":"가","p":0.5,"sell":45000000,"glow":"#FFC400"},{"name":"그람","o":"을","i":"이","p":0.45,"sell":72000000,"glow":"#E8C25A"},{"name":"천상의 검","o":"을","i":"이","p":0.4,"sell":96000000,"glow":"#6FC3FF"},{"name":"심연의 검","o":"을","i":"이","p":0.4,"sell":168000000,"glow":"#2FA8B8"},{"name":"광대의 쌍검","o":"을","i":"이","p":0.4,"sell":218000000,"glow":"#D64AFF"},{"name":"혼돈의 대도","o":"를","i":"가","p":0.4,"sell":315000000,"glow":"#C8863C"},{"name":"신의 검","o":"을","i":"이","p":0.35,"sell":380000000,"glow":"#FFF0A0"},{"name":"세계수 검","o":"을","i":"이","p":0.5,"sell":1900000000,"glow":"#4CD137"},{"name":"은하수 검","o":"을","i":"이","p":0.4,"sell":2400000000,"glow":"#5A6CFF"},{"name":"퍼즐 검","o":"을","i":"이","p":0.15,"sell":0,"glow":"#4A90FF"},{"name":"태양을 담근 검","o":"을","i":"이","p":0,"sell":0,"glow":"#FF8C1A"}],"axes":[{"name":"녹슨 손도끼","o":"를","i":"가"},{"name":"나무꾼의 도끼","o":"를","i":"가"},{"name":"왠지 강한 도끼","o":"를","i":"가"},{"name":"고블린 손도끼","o":"를","i":"가"},{"name":"토마호크","o":"를","i":"가"},{"name":"프란시스카","o":"를","i":"가"},{"name":"바이킹 수염도끼","o":"를","i":"가"},{"name":"버서커 도끼","o":"를","i":"가"},{"name":"오리하르콘 도끼","o":"를","i":"가"},{"name":"암흑기사 도끼","o":"를","i":"가"},{"name":"성기사 심판도끼","o":"를","i":"가"},{"name":"라브리스","o":"를","i":"가"},{"name":"녹색 기사의 도끼","o":"를","i":"가"},{"name":"개산부","o":"를","i":"가"},{"name":"우콘키르베스","o":"를","i":"가"},{"name":"화산 심장도끼","o":"를","i":"가"},{"name":"드래곤 도축도끼","o":"를","i":"가"},{"name":"림무귀그르","o":"를","i":"가"},{"name":"오셰","o":"를","i":"가"},{"name":"히민텔갸","o":"를","i":"가"},{"name":"헬","o":"을","i":"이"},{"name":"파라슈","o":"를","i":"가"},{"name":"페룬의 천둥도끼","o":"를","i":"가"},{"name":"포르세티의 도끼","o":"를","i":"가"},{"name":"펜리르 도끼","o":"를","i":"가"},{"name":"헤파이스토스 도끼","o":"를","i":"가"},{"name":"요르문간드 도끼","o":"를","i":"가"},{"name":"시간을 벤 도끼","o":"를","i":"가"},{"name":"종말의 도끼","o":"를","i":"가"},{"name":"창세의 도끼","o":"를","i":"가"}],"last":29,"aura":{"glow":"#FF8C1A","accent":"#FFC24A","stars":[{"points":"68.38,26.62 69.62,29.92 73.14,30.07 70.38,32.27 71.32,35.66 68.38,33.72 65.44,35.66 66.38,32.27 63.63,30.07 67.15,29.92","fill":"#E8281B"},{"points":"31.62,26.62 32.85,29.92 36.37,30.07 33.62,32.27 34.56,35.66 31.62,33.72 28.68,35.66 29.62,32.27 26.86,30.07 30.38,29.92","fill":"#F2C900"},{"points":"31.62,63.38 32.85,66.68 36.37,66.84 33.62,69.03 34.56,72.43 31.62,70.48 28.68,72.43 29.62,69.03 26.86,66.84 30.38,66.68","fill":"#3DBE4A"},{"points":"68.38,63.38 69.62,66.68 73.14,66.84 70.38,69.03 71.32,72.43 68.38,70.48 65.44,72.43 66.38,69.03 63.63,66.84 67.15,66.68","fill":"#1B6FE8"}]}};

      /** base64url → 글자. 깨져 있으면 빈 글자다(링크가 잘려도 화면은 서야 한다). */
      function text(v) {
        if (!v) return "";
        try {
          const b = atob(v.replace(/-/g, "+").replace(/_/g, "/"));
          const u = new Uint8Array(b.length);
          for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
          return new TextDecoder().decode(u).slice(0, 40);
        } catch {
          return "";
        }
      }
      const won = (n) => n.toLocaleString("ko-KR") + "원";

      const q = new URLSearchParams(location.search);
      const lv = Number(q.get("l"));
      const axe = q.get("w") === "a";
      const broken = q.get("b") === "1";
      const who = text(q.get("f"));
      const word = text(q.get("m"));

      const ok = Number.isInteger(lv) && lv >= 0 && lv <= 29 && DATA;
      if (!ok) {
        const e = document.getElementById("empty");
        e.hidden = false;
        if (q.get("l") !== null) {
          document.getElementById("et").textContent = "링크를 읽을 수 없어요";
          document.getElementById("eb").textContent = "주소가 잘렸거나 잘못된 링크예요.";
        }
      } else {
        const row = DATA.levels[lv];
        /* 이름과 **조사**는 한 묶음으로 온다(빌드가 앱 `josa()`로 골라 넣는다). */
        const w = axe ? DATA.axes[lv] : row;
        const name = w.name;
        document.getElementById("main").hidden = false;
        /* ⚠️ 전부 `textContent`다 — 남이 적은 글자가 태그로 읽힐 자리를 만들지 않는다. */
        document.getElementById("who").textContent = who || "누군가";
        document.getElementById("who2").textContent = who || "누군가";
        const h = document.getElementById("headline");
        h.innerHTML = '<span class="lv"></span>';
        h.firstChild.textContent = "+" + lv + " " + name;
        /* ⚠️ 조사를 박지 않는다 — `히민텔갸이 터졌어요`가 됐었다(2026-10-07). */
        h.append(broken ? w.i + " 터졌어요" : w.o + " 만들었어요");
        /* 부제는 **파괴일 때만** 쓴다. 성공 쪽은 큰 글자가 이미 다 말했다 — 설명을 덧붙이면 원작 톤이 아니다. */
        document.getElementById("sub").textContent = broken ? "여기서 부서졌습니다" : "";
        const pic = document.getElementById("pic");
        pic.src = (axe ? "axes/axe-" : "swords/sword-") + String(lv).padStart(2, "0") + ".png";
        pic.alt = "+" + lv + " " + name;
        if (axe) pic.classList.add("skin");
        const art = document.getElementById("art");
        if (broken) {
          art.classList.add("broken");
          pic.classList.add("top");
          /* 아랫조각 — **같은 파일**을 한 번 더 띄운다. 새 그림을 만들지 않는 이유가 이것이다. */
          const bot = pic.cloneNode(false);
          bot.classList.remove("top");
          bot.classList.add("bot");
          bot.alt = "";
          art.append(bot);
        } else {
          /* 광채 — 앱의 `AssetImage`와 **같은 식**이다(`drop-shadow` 둘). 색은 검마다 다르다. */
          pic.style.filter = "drop-shadow(0 0 6px " + row.glow + ") drop-shadow(0 0 14px " + row.glow + ")";
          /* 마지막 단계만 아우라·별 넷을 얹는다. 부서진 검에는 안 얹는다 — 축하 표시다. */
          if (lv === DATA.last) {
            const a = DATA.aura;
            const ns = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(ns, "svg");
            svg.setAttribute("class", "swordfx sword-aura");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("aria-hidden", "true");
            const circle = (r, fill, op, cls) => {
              const c = document.createElementNS(ns, "circle");
              c.setAttribute("class", cls);
              c.setAttribute("cx", "50");
              c.setAttribute("cy", "50");
              c.setAttribute("r", r);
              c.setAttribute("fill", fill);
              c.setAttribute("fill-opacity", op);
              return c;
            };
            svg.append(circle("24", a.glow, "0.2", "aura"), circle("18", a.accent, "0.26", "aura aura2"));
            const g = document.createElementNS(ns, "g");
            g.setAttribute("class", "aurastars");
            for (const st of a.stars) {
              const poly = document.createElementNS(ns, "polygon");
              poly.setAttribute("points", st.points);
              poly.setAttribute("fill", st.fill);
              poly.setAttribute("stroke", "#000");
              poly.setAttribute("stroke-width", "1.3");
              poly.setAttribute("stroke-linejoin", "round");
              g.append(poly);
            }
            svg.append(g);
            art.append(svg);
          }
        }
        if (word) {
          document.getElementById("wordbox").hidden = false;
          document.getElementById("word").textContent = "“" + word + "”";
        }
        /* ⚠️ +29는 올릴 데가 없어 `p`가 0이다 — 그대로 적으면 `성공률 0%`라는 거짓말이 된다. */
        document.getElementById("rate").textContent = row.p > 0 ? Math.round(row.p * 100) + "%" : "최고 단계";
        /* ⚠️ 못 파는 단계(+28·+29)다. **앱은 이 자리에 `알 수 없음`·`Unknown`을 적는다**(원작 표의 `sellLabel`) —
           웹만 `무한`인 것은 2026-10-07 사용자 지시다. 앱 쪽을 맞출지는 아직 안 정했다. */
        document.getElementById("sell").textContent = row.sell > 0 ? won(row.sell) : "무한";
      }


      /* PC에서는 `intoss://`가 안 열려 **버튼이 죽는다** — 눌러도 아무 일 없는 버튼을 만들지 않는다
         (프로젝트 규칙). 버튼을 더 만들지 않고 **그 버튼이 하는 일만** 바꾼다: 주소 복사.
         거북이도 같은 자리에서 갈랐다(`링크 복사` + `토스 앱이 필요해요`). */
      const mobile = (() => {
        const d = navigator.userAgentData;
        if (typeof d?.mobile === "boolean") return d.mobile;
        return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      })();
      if (!mobile) {
        const btn = document.getElementById("open");
        btn.removeAttribute("href");
        btn.textContent = "링크 복사";
        btn.style.cursor = "pointer";
        document.querySelector(".note").textContent = "휴대폰 토스 앱에서 열려요. 링크를 복사해 폰으로 보내세요";
        btn.addEventListener("click", async () => {
          const back = btn.textContent;
          try {
            await navigator.clipboard.writeText(location.href);
            btn.textContent = "복사했어요";
          } catch {
            btn.textContent = "주소창에서 복사해 주세요";
          }
          setTimeout(() => (btn.textContent = back), 1600);
        });
      }
    </script>
  </body>
</html>
